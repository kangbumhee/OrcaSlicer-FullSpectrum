name: Build Windows Release

on:
  push:
    branches: [auto-color-mapping]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        lfs: true

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install Perl
      run: choco install strawberryperl -y

    - name: Cache Deps
      id: cache-deps
      uses: actions/cache@v4
      with:
        path: deps/build/OrcaSlicer_dep
        key: deps-win-v2-${{ hashFiles('deps/**/*.cmake') }}

    - name: Build Deps
      if: steps.cache-deps.outputs.cache-hit != 'true'
      shell: cmd
      run: |
        mkdir deps\build
        cd deps\build
        cmake ../ -G "Visual Studio 17 2022" -A x64 -DDESTDIR="%GITHUB_WORKSPACE%\deps\build\OrcaSlicer_dep" -DCMAKE_BUILD_TYPE=Release -DDEP_DEBUG=OFF -DORCA_INCLUDE_DEBUG_INFO=OFF
        cmake --build . --config Release --target deps -- -m

    - name: Patch Boost headers
      shell: powershell
      run: |
        $boostDir = "$env:GITHUB_WORKSPACE\deps\build\OrcaSlicer_dep\usr\local\include\boost-1_84\boost"
        
        # Fix w32_regex_traits.hpp - add windows.h
        $regexFile = "$boostDir\regex\v5\w32_regex_traits.hpp"
        if (Test-Path $regexFile) {
          $content = [IO.File]::ReadAllText($regexFile)
          if ($content -notmatch '#include\s*<windows\.h>') {
            $content = "#ifndef NOMINMAX`n#define NOMINMAX`n#endif`n#include <windows.h>`n" + $content
            [IO.File]::WriteAllText($regexFile, $content)
            Write-Host "Patched w32_regex_traits.hpp"
          }
        }
        
        # Fix nowide/filebuf.hpp - add NOMINMAX guard
        $nowideFile = "$boostDir\nowide\filebuf.hpp"
        if (Test-Path $nowideFile) {
          $content = [IO.File]::ReadAllText($nowideFile)
          if ($content -notmatch '#ifndef NOMINMAX') {
            $content = "#ifndef NOMINMAX`n#define NOMINMAX`n#endif`n" + $content
            [IO.File]::WriteAllText($nowideFile, $content)
            Write-Host "Patched filebuf.hpp"
          }
        }

    - name: Patch source files
      shell: powershell
      run: |
        $srcDir = "$env:GITHUB_WORKSPACE\src\libslic3r"
        
        # Fix Hollowing.cpp - add numeric
        $hFile = "$srcDir\SLA\Hollowing.cpp"
        if (Test-Path $hFile) {
          $c = [IO.File]::ReadAllText($hFile)
          if ($c -notmatch '#include\s*<numeric>') {
            $c = "#include <numeric>`n" + $c
            [IO.File]::WriteAllText($hFile, $c)
            Write-Host "Patched Hollowing.cpp"
          }
        }

    - name: Build App
      shell: cmd
      run: |
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="%GITHUB_WORKSPACE%\deps\build\OrcaSlicer_dep\usr\local" -DCMAKE_INSTALL_PREFIX="./Snapmaker_Orca" -DCMAKE_BUILD_TYPE=Release -DSLIC3R_PCH=OFF -DCMAKE_CXX_FLAGS="/DNOMINMAX /DWIN32_LEAN_AND_MEAN /FI windows.h"
        cmake --build . --config Release --target ALL_BUILD -- -m

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Snapmaker_Orca_AutoColorMapping
        path: build/src/Release/
