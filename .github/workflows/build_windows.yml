name: Build Windows Release

on:
  push:
    branches: [auto-color-mapping]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        lfs: true

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install Perl
      run: choco install strawberryperl -y

    - name: Cache Deps
      id: cache-deps
      uses: actions/cache@v4
      with:
        path: deps/build/OrcaSlicer_dep
        key: deps-win-v4-${{ hashFiles('deps/**/*.cmake') }}

    - name: Build Deps
      if: steps.cache-deps.outputs.cache-hit != 'true'
      shell: cmd
      run: |
        mkdir deps\build
        cd deps\build
        cmake ../ -G "Visual Studio 17 2022" -A x64 -DDESTDIR="%GITHUB_WORKSPACE%\deps\build\OrcaSlicer_dep" -DCMAKE_BUILD_TYPE=Release -DDEP_DEBUG=OFF -DORCA_INCLUDE_DEBUG_INFO=OFF
        cmake --build . --config Release --target deps -- -m

    - name: Patch Boost and source files
      shell: powershell
      run: |
        $boostDir = "$env:GITHUB_WORKSPACE\deps\build\OrcaSlicer_dep\usr\local\include\boost-1_84\boost"
        $incDir = "$env:GITHUB_WORKSPACE\deps\build\OrcaSlicer_dep\usr\local\include"
        $srcDir = "$env:GITHUB_WORKSPACE\src\libslic3r"
        
        # Patch w32_regex_traits.hpp - add windows.h
        $f = "$boostDir\regex\v5\w32_regex_traits.hpp"
        if (Test-Path $f) {
          $c = [IO.File]::ReadAllText($f)
          if ($c -notmatch '#include\s*<windows\.h>') {
            $c = "#ifndef NOMINMAX`n#define NOMINMAX`n#endif`n#ifndef WIN32_LEAN_AND_MEAN`n#define WIN32_LEAN_AND_MEAN`n#endif`n#include <windows.h>`n" + $c
            [IO.File]::WriteAllText($f, $c)
            Write-Host "Patched w32_regex_traits.hpp"
          }
        }
        
        # Patch nowide/filebuf.hpp - add NOMINMAX guard
        $f = "$boostDir\nowide\filebuf.hpp"
        if (Test-Path $f) {
          $c = [IO.File]::ReadAllText($f)
          if ($c -notmatch '#ifndef NOMINMAX') {
            $c = "#ifndef NOMINMAX`n#define NOMINMAX`n#endif`n" + $c
            [IO.File]::WriteAllText($f, $c)
            Write-Host "Patched filebuf.hpp"
          }
        }
        
        # Patch Hollowing.cpp - add numeric
        $f = "$srcDir\SLA\Hollowing.cpp"
        if (Test-Path $f) {
          $c = [IO.File]::ReadAllText($f)
          if ($c -notmatch '#include\s*<numeric>') {
            $c = "#include <numeric>`n" + $c
            [IO.File]::WriteAllText($f, $c)
            Write-Host "Patched Hollowing.cpp"
          }
        }
        
        # Patch BlacklistedLibraryCheck.cpp - add boost filesystem
        $f = "$srcDir\BlacklistedLibraryCheck.cpp"
        if (Test-Path $f) {
          $c = [IO.File]::ReadAllText($f)
          if ($c -notmatch '#include\s*<boost/filesystem\.hpp>') {
            $c = "#include <boost/filesystem.hpp>`n" + $c
            [IO.File]::WriteAllText($f, $c)
            Write-Host "Patched BlacklistedLibraryCheck.cpp"
          }
        }
        
        # Create gmpxx.h stub (GMP C++ bindings header)
        $gmpxx = "$incDir\gmpxx.h"
        if (-not (Test-Path $gmpxx)) {
          $stub = "#pragma once`n#include `"gmp.h`"`n"
          [IO.File]::WriteAllText($gmpxx, $stub)
          Write-Host "Created gmpxx.h stub"
        }
        
        # Patch CGAL/gmpxx.h to use local gmpxx.h
        $f = "$incDir\CGAL\gmpxx.h"
        if (Test-Path $f) {
          $c = [IO.File]::ReadAllText($f)
          if ($c -match '#include\s*<gmpxx\.h>') {
            $c = $c -replace '#include\s*<gmpxx\.h>', '#include "gmpxx.h"'
            [IO.File]::WriteAllText($f, $c)
            Write-Host "Patched CGAL/gmpxx.h"
          }
        }

    - name: Build App
      shell: cmd
      run: |
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="%GITHUB_WORKSPACE%\deps\build\OrcaSlicer_dep\usr\local" -DCMAKE_INSTALL_PREFIX="./Snapmaker_Orca" -DCMAKE_BUILD_TYPE=Release -DSLIC3R_PCH=OFF -DCMAKE_CXX_FLAGS="/DNOMINMAX"
        cmake --build . --config Release --target ALL_BUILD -- -m

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Snapmaker_Orca_AutoColorMapping
        path: build/src/Release/
