name: Build Windows Release

on:
  push:
    branches: [ auto-color-mapping ]
  workflow_dispatch:

env:
  CXXFLAGS: /DNOMINMAX

jobs:
  build:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        lfs: true
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    - name: Install Perl
      run: choco install strawberryperl -y
    - name: Cache Deps
      id: cache-deps
      uses: actions/cache@v4
      with:
        path: deps/build/OrcaSlicer_dep
        key: deps-win-v1-${{ hashFiles('deps/**/*.cmake') }}
    - name: Build Deps
      if: steps.cache-deps.outputs.cache-hit != 'true'
      shell: cmd
      run: |
        mkdir deps\build
        cd deps\build
        cmake ../ -G "Visual Studio 17 2022" -A x64 -DDESTDIR="${{ github.workspace }}\deps\build\OrcaSlicer_dep" -DCMAKE_BUILD_TYPE=Release -DDEP_DEBUG=OFF -DORCA_INCLUDE_DEBUG_INFO=OFF
        cmake --build . --config Release --target deps -- -m
    - name: Build App
      shell: cmd
      run: |
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="${{ github.workspace }}\deps\build\OrcaSlicer_dep\usr\local" -DCMAKE_INSTALL_PREFIX="./Snapmaker_Orca" -DCMAKE_BUILD_TYPE=Release -DSLIC3R_PCH=OFF
        cmake --build . --config Release --target ALL_BUILD -- -m
    - uses: actions/upload-artifact@v4
      with:
        name: Snapmaker_Orca_AutoColorMapping
        path: build/src/Release/